# KI-Log Nr. 9, 11, 20
name: ExerciseDB Live Check

# Nur manuell starten (Actions -> ExerciseDB Live Check -> Run workflow),
# damit der öffentliche Katalog nicht bei jedem Push belastet wird.
on:
  workflow_dispatch:

jobs:
  live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BEBETTER_LIVE_URL: ${{ vars.BEBETTER_LIVE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Probe real catalog (no database, no mocked answers)
        run: mvn -B -f backend/pom.xml -Dbebetter.live=true -Dtest=LiveExerciseDbTest test